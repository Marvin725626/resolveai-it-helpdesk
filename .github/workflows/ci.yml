name: CI - Continuous Integration

on:
  push:
    branches: [ main, master, develop, 'codex/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      IT_DEMO_ENABLED: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Generate an ephemeral password for isolated CI fixtures
        run: |
          python - <<'PYCODE'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write("IT_DEMO_PASSWORD=" + secrets.token_hex(24) + "Aa1!\n")
          PYCODE

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run Pytest Test Suite
        working-directory: ./backend
        run: |
          python -m pytest tests/test_resolveai.py -q
          python -m pytest tests/test_manual_requests.py -q
          python -m pytest tests/test_invitations.py -q
          python -m pytest tests/test_notifications.py -q
          python -m pytest tests/test_requester_followup.py -q
          python -m pytest tests/test_attachments.py -q
          python -m pytest tests/test_resolutions.py -q
          python -m pytest tests/test_knowledge_drafts.py -q
          python -m pytest tests/test_triage.py -q
          python -m pytest tests/test_ticket_filters.py -q
          python -m pytest tests/test_team_metrics.py -q
          python -m pytest tests/test_recovery_bundle.py -q

      - name: Evaluate offline fixtures in an isolated database
        run: python scripts/evaluate_isolated.py --strict --output "${{ runner.temp }}/resolveai-evaluation.json"

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check authored frontend formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Check high-severity frontend dependency advisories
        working-directory: ./frontend
        run: npm audit --audit-level high

      - name: Verify CSV export formatting and formula handling
        working-directory: ./frontend
        run: npm run test:csv

      - name: TypeScript Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build
