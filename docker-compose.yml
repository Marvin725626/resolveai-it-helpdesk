version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: supportpro_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-supportpro_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be defined in .env or environment}"
      POSTGRES_DB: "${POSTGRES_DB:-ai_supportpro}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-supportpro_user} -d $${POSTGRES_DB:-ai_supportpro}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supportpro_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportpro_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      DEBUG: "${DEBUG:-False}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-supportpro_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_supportpro}}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      AUTH_SECRET: "${AUTH_SECRET:?Error: AUTH_SECRET must be defined in .env or environment}"
      DEFAULT_LLM_PROVIDER: "${DEFAULT_LLM_PROVIDER:-mock}"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      WHATSAPP_VERIFY_TOKEN: "${WHATSAPP_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportpro_frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      VITE_API_BASE: "${VITE_API_BASE:-http://localhost:8000}"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:

